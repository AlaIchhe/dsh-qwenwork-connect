name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 不要给 setup-node 传 registry-url：它会写入一个占位 NODE_AUTH_TOKEN，
      # npm 会拿假 token 去请求，注册表回 404，trusted publishing 的 OIDC 就用不上了
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm publish --provenance --access public
